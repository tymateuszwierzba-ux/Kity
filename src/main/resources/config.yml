database:
  type: "sqlite"
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    user: "root"
    password: "password"

autosave:
  interval-seconds: 120

welcome:
  enabled: true
  delay-ticks: 60
  interval-ticks: 12000

favorites:
  max-per-player: 54

history:
  max-entries: 200

player-settings:
  defaults:
    sounds: true
    particles: true
    claim-animation: true
    text-animation: true
    title-feedback: true
    bossbar-feedback: true
    actionbar-feedback: true

sounds:
  open: "UI_BUTTON_CLICK"
  click: "UI_BUTTON_CLICK"
  claim: "ENTITY_PLAYER_LEVELUP"
  error: "BLOCK_NOTE_BLOCK_BASS"
  confirm: "BLOCK_ANVIL_LAND"

feedback:
  claim:
    channels: ["chat"]
    message-animation:
      enabled: true
      channels: ["actionbar", "bossbar"]
      interval-ticks: 1
      actionbar-duration-ticks: 40
    title:
      fade-in: 10
      stay: 40
      fade-out: 10
    bossbar:
      duration-ticks: 60
      color: "GREEN"
      style: "SOLID"

animation:
  claim:
    enabled: true
    particle: "FIREWORKS_SPARK"
    duration-ticks: 20
    points: 24
    radius: 1.2
    height: 1.6
    rotation: 0.4
    y-offset: 0.2
    burst:
      enabled: true
      count: 30
      offset-y: 1.0
      spread: 0.4
      speed: 0.02
