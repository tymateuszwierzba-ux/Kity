name: fortcode-kits
version: 2.0.0
main: pl.tymek24.fortcodekits.FortCodeKits
api-version: '1.18'
author: TYMEK24
description: FORT-CODE KITS - rozbudowany system kitow z GUI, statystykami i ekonomia
softdepend: [PlaceholderAPI, Vault, LuckPerms]
commands:
  kits:
    aliases: [kit, fortkits]
    description: Otwiera GUI kitow
    permission: fortcode.kits.use
  adminkit:
    description: Panel administracyjny kitow
    usage: "/adminkit <open|create|edit|delete|setname|setcooldown|setslot|setrank|setprice|setcategory|setrarity|setclaimlimit|toggle-onetime|toggle-enabled|toggle-hidden|toggle-welcome|duplicate|resetall|stats|history|top|search|clearhistory|clearstats|animation|claimanim|reload>"
    permission: fortcode.kits.admin
permissions:
  fortcode.kits.use:
    default: true
  fortcode.kits.kit.*:
    default: op
  fortcode.kits.*:
    default: op
  fortcode.kits.admin:
    default: op
  fortcode.kits.reload:
    default: op
  fortcode.kits.give:
    default: op
  fortcode.kits.hidden:
    default: op
  fortcode.kits.history.all:
    default: op
  fortcode.kits.favorites:
    default: true
  fortcode.kits.stats:
    default: true
  fortcode.kits.settings:
    default: true
