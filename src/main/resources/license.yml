# 1) Ustaw license.enabled: true
# 2) Ustaw owner, server-id i expires-at
# 3) Wygeneruj key i wklej ponizej
#
# Runtime server-id znajdziesz w logach pluginu (np. 0.0.0.0:25565).
# expires-at: "never" albo data w formacie YYYY-MM-DD.

license:
  enabled: false
  owner: "twoj_nick"
  server-id: "auto"
  expires-at: "never"
  key: "WSTAW_KEY"
